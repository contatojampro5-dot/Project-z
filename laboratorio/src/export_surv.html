<html><body><script src="engine.js"></script><script>
function stylize(c){const x=c.getContext('2d'),W=c.width,H=c.height,img=x.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;let r=d[i],g=d[i+1],b=d[i+2];const l=(r+g+b)/3;
    r=l+(r-l)*1.28;g=l+(g-l)*1.28;b=l+(b-l)*1.28;r=(r-128)*1.1+134;g=(g-128)*1.1+134;b=(b-128)*1.1+134;
    d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));}
  x.putImageData(img,0,0);}
window.exportOne=(k)=>{const v=ZE.VARIANTS[k];const A=ZE.animsOf(v);const cl=ZE.cellOf(v);const rows=Object.values(A).reduce((s,a)=>s+a.frames,0);
 const t=ZE.buildTemplate(v,1.15);const gw=cl.w/2,gh=cl.h/2;
 const g=document.createElement('canvas');g.width=gw*8;g.height=gh*rows;const gx=g.getContext('2d');gx.imageSmoothingQuality='high';
 const cell=document.createElement('canvas');cell.width=cl.w;cell.height=cl.h;const cx=cell.getContext('2d');
 const small=document.createElement('canvas');small.width=gw;small.height=gh;const sx=small.getContext('2d');sx.imageSmoothingQuality='high';
 let r=0;const meta={};
 for(const[a,def]of Object.entries(A)){meta[a]={row:r,frames:def.frames,fps:def.fps,loop:def.loop};
   for(let f=0;f<def.frames;f++){const u=def.loop?f/def.frames:f/(def.frames-1);const P=ZE.pose(a,u,v);P.flash=0;
     for(let d=0;d<8;d++){cx.clearRect(0,0,cl.w,cl.h);ZE.render(cx,t,P,{scale:cl.scale,x:cl.w/2,y:cl.ground,facing:d*Math.PI/4,fill:.45,outlineMax:1.7,glow:true});
       sx.clearRect(0,0,gw,gh);sx.drawImage(cell,0,0,gw,gh);stylize(small);gx.drawImage(small,d*gw,r*gh);}
     r++;}}
 const muzzle=[0,1,2,3,4,5,6,7].map(d=>ZE.muzzleScreen(v,d,cl.scale/2).map(x=>+x.toFixed(1)));
 return {img:g.toDataURL('image/webp',.86),meta,cell:{w:gw,h:gh,ground:cl.ground/2,cx:gw/2},muzzle};};
window.keys=()=>Object.keys(ZE.VARIANTS).filter(k=>ZE.VARIANTS[k].alive);
</script></body></html>
